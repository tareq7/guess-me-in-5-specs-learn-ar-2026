name: Lens scene source checks
on:
  push:
    paths:
      - "Assets/Scene.scene"
      - "Assets/Scripts/**"
      - "package.json"
      - "scripts/verify-scene.mjs"
      - "tests/**"
      - ".github/workflows/scene-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run scene:check
